name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach assets to
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      SBOM_FILE: ursa-${{ inputs.tag }}-sbom.cdx.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Validate release tag and metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must use the vX.Y.Z format."
            exit 1
          fi
          VERSION="${TAG#v}"
          grep -Fq "versionName = \"${VERSION}\"" app/build.gradle.kts
          grep -Fq "versionName = \"${VERSION}\"" wear/build.gradle.kts
          python3 scripts/check_fdroid_metadata.py
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. Add the release signing secrets before publishing (see README)."
            exit 1
          fi
          KS="${RUNNER_TEMP}/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          echo "path=$KS" >> "$GITHUB_OUTPUT"

      - name: Build signed release APKs (phone + watch)
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :wear:assembleRelease --no-daemon --stacktrace

      - name: Name the APKs after the tag
        id: apk
        run: |
          cp app/build/outputs/apk/release/app-release.apk "ursa-${TAG}.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "ursa-wear-${TAG}.apk"
          echo "path=ursa-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "wear=ursa-wear-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.apk.outputs.path }}
          format: cyclonedx-json
          output-file: ${{ env.SBOM_FILE }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.wear }}

      - name: Checksums
        env:
          PHONE_APK: ${{ steps.apk.outputs.path }}
          WEAR_APK: ${{ steps.apk.outputs.wear }}
        run: sha256sum "$PHONE_APK" "$WEAR_APK" "$SBOM_FILE" > SHA256SUMS.txt

      - name: Upload assets to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHONE_APK: ${{ steps.apk.outputs.path }}
          WEAR_APK: ${{ steps.apk.outputs.wear }}
        run: |
          gh release upload "$TAG" \
            "$PHONE_APK" \
            "$WEAR_APK" \
            "$SBOM_FILE" \
            SHA256SUMS.txt \
            --clobber
