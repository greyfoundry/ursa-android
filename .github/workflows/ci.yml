name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  punctuation:
    name: ASCII punctuation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No em/en dashes in tracked files
        run: |
          # CHANGELOG.md is generated from historical commit subjects (some predate
          # the ASCII rule), so it is excluded; new commit messages are still guarded
          # by the commit-msg hook.
          if git grep -lP '[\x{2013}\x{2014}]' -- . ':(exclude)CHANGELOG.md' >/tmp/hits 2>/dev/null && [ -s /tmp/hits ]; then
            echo "Em/en dash found in:"; cat /tmp/hits
            echo "Use an ASCII hyphen '-' instead."
            exit 1
          fi
          echo "OK: tracked files use ASCII punctuation."

  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Assemble, test, and lint both phone distributions
        run: |
          ./gradlew \
            :app:assembleFdroidDebug \
            :app:assembleGithubDebug \
            :app:testFdroidDebugUnitTest \
            :app:testGithubDebugUnitTest \
            :app:lintFdroidDebug \
            :app:lintGithubDebug \
            --stacktrace --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-*Debug.html
          if-no-files-found: ignore

  fdroid:
    name: F-Droid metadata and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Validate F-Droid metadata
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python scripts/check_fdroid_metadata.py
          python scripts/check_monitor_screenshot.py
          python scripts/check_action_pins.py

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build F-Droid-compatible release APK
        run: ./gradlew :app:assembleFdroidRelease --stacktrace --no-daemon

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fdroid-release-apk
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          if-no-files-found: error
