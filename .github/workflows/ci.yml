name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  punctuation:
    name: ASCII punctuation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No em/en dashes in tracked files
        run: |
          # CHANGELOG.md is generated from historical commit subjects (some predate
          # the ASCII rule), so it is excluded; new commit messages are still guarded
          # by the commit-msg hook.
          if git grep -lP '[\x{2013}\x{2014}]' -- . ':(exclude)CHANGELOG.md' >/tmp/hits 2>/dev/null && [ -s /tmp/hits ]; then
            echo "Em/en dash found in:"; cat /tmp/hits
            echo "Use an ASCII hyphen '-' instead."
            exit 1
          fi
          echo "OK: tracked files use ASCII punctuation."

  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Assemble debug, test, lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  fdroid:
    name: F-Droid metadata and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate F-Droid metadata
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python scripts/check_fdroid_metadata.py
          python scripts/check_monitor_screenshot.py
          python scripts/check_action_pins.py

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build F-Droid-compatible release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fdroid-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
