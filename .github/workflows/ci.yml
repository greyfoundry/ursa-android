name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  punctuation:
    name: ASCII punctuation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No em/en dashes in tracked files
        run: |
          # CHANGELOG.md is generated from historical commit subjects (some predate
          # the ASCII rule), so it is excluded; new commit messages are still guarded
          # by the commit-msg hook.
          if git grep -lP '[\x{2013}\x{2014}]' -- . ':(exclude)CHANGELOG.md' >/tmp/hits 2>/dev/null && [ -s /tmp/hits ]; then
            echo "Em/en dash found in:"; cat /tmp/hits
            echo "Use an ASCII hyphen '-' instead."
            exit 1
          fi
          echo "OK: tracked files use ASCII punctuation."

  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug, test, lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  fdroid:
    name: F-Droid metadata and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate F-Droid metadata
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python scripts/check_fdroid_metadata.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build F-Droid-compatible release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
