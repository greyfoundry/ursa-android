name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when a release was just created (the release PR was merged). Builds a
  # signed APK, generates an SBOM, attests provenance, and attaches everything to the
  # release. Requires the ANDROID_KEYSTORE_* repository secrets (see README).
  release-artifacts:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      SBOM_FILE: ursa-${{ needs.release-please.outputs.tag_name }}-sbom.cdx.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. Add the release signing secrets before publishing (see README)."
            exit 1
          fi
          KS="${RUNNER_TEMP}/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          echo "path=$KS" >> "$GITHUB_OUTPUT"

      - name: Build signed release APKs (phone + watch)
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :wear:assembleRelease --no-daemon --stacktrace

      - name: Name the APKs after the tag
        id: apk
        run: |
          cp app/build/outputs/apk/release/app-release.apk "ursa-${TAG}.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "ursa-wear-${TAG}.apk"
          echo "path=ursa-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "wear=ursa-wear-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ steps.apk.outputs.path }}
          format: cyclonedx-json
          output-file: ${{ env.SBOM_FILE }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.wear }}

      - name: Checksums
        env:
          PHONE_APK: ${{ steps.apk.outputs.path }}
          WEAR_APK: ${{ steps.apk.outputs.wear }}
        run: sha256sum "$PHONE_APK" "$WEAR_APK" "$SBOM_FILE" > SHA256SUMS.txt

      - name: Upload assets to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHONE_APK: ${{ steps.apk.outputs.path }}
          WEAR_APK: ${{ steps.apk.outputs.wear }}
        run: |
          gh release upload "$TAG" \
            "$PHONE_APK" \
            "$WEAR_APK" \
            "$SBOM_FILE" \
            SHA256SUMS.txt \
            --clobber
