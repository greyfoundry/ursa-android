version: 2
updates:
  # Gradle dependencies (reads the version catalog gradle/libs.versions.toml).
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Keep routine minor/patch bumps in a single PR to reduce noise.
      gradle-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # CodeQL's hosted Kotlin extractor currently rejects 2.4.20. Keep the
      # compiler and its plugins aligned until the hosted scanner supports it.
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
        versions: ["2.4.20"]
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        versions: ["2.4.20"]
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
        versions: ["2.4.20"]

  # GitHub Actions used by our workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
